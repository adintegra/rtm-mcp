[project]
name = "rtm-mcp"
version = "0.1.0"
description = "MCP server for Remember The Milk task planning with calendar awareness"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
rtm-mcp = "rtm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtm_mcp"]
